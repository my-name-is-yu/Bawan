name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-translate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native arm64 app and checks
        run: |
          test "$(uname -m)" = arm64
          ./scripts/build.sh -DLORE_BUILD_TESTS=ON -DLORE_BUILD_SMOKE=ON
          cmake --build build --target gesture_tests shortcut_tests short_input_tests shortcut_preferences_tests panel_smoke settings_smoke mascot_smoke engine_smoke engine_profile --parallel 3
          codesign --verify --strict build/Lore.app
          ctest --test-dir build --output-on-failure
      - name: Check pointer motion with OS Reduce Motion disabled
        run: |
          set -euo pipefail
          lore_previous_reduce_motion=$(defaults read com.apple.universalaccess reduceMotion 2>/dev/null || true)
          restore_lore_motion_preference() {
            if [ -n "$lore_previous_reduce_motion" ]; then
              case "$lore_previous_reduce_motion" in
                1|true|yes) defaults write com.apple.universalaccess reduceMotion -bool true ;;
                0|false|no) defaults write com.apple.universalaccess reduceMotion -bool false ;;
                *) return 1 ;;
              esac
            else
              defaults delete com.apple.universalaccess reduceMotion 2>/dev/null || true
            fi
          }
          trap restore_lore_motion_preference EXIT
          defaults write com.apple.universalaccess reduceMotion -bool false
          cd build
          LORE_EXPECT_REDUCE_MOTION=0 ./panel_smoke | tee panel-smoke/normal-motion.log
      - name: Upload AppKit view captures (not full UI validation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-view-captures
          path: |
            build/panel-smoke/
            build/settings-smoke/
            build/mascot-smoke/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Verify and translate with the official model
        run: |
          mkdir -p build/models
          model_path=build/models/plamo-3-translate-0.8b-Q4_K_M.gguf
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 \
            https://huggingface.co/pfnet/plamo-3-translate-0.8b-GGUF/resolve/1cf96ae02133958a20074bfdfab76517bb737d00/plamo-3-translate-0.8b-Q4_K_M.gguf \
            -o "$model_path"
          echo "70891ec70dc7ab4205745a38307867c2881b99239f20327927633abfe4bc9ec6  $model_path" | shasum -a 256 -c -
          ./build/engine_smoke "$model_path"
          ./build/engine_profile "$model_path"
